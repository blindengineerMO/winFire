<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinFIRE Internet Visibility</title><style>body{font:14px system-ui,sans-serif;max-width:650px;margin:40px auto;padding:0 20px;color:#19324a}label{display:grid;gap:6px;margin:16px 0;font-weight:600}input{padding:10px;border:1px solid #9aaabd;border-radius:5px}button{padding:10px 16px;border:0;border-radius:5px;background:#4059a6;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}.status{padding:10px;border-radius:5px;background:#eef2f7}.error{background:#fde7e7;color:#8a1f2d}.success{background:#e3f5ec;color:#17643e}</style></head>
<body><h1>WinFIRE Internet Visibility</h1><p>Enroll this browser with a short-lived code created by a WinFIRE administrator. Only navigation hostnames, and optionally path prefixes, are sent. Query strings, page contents, forms, cookies, credentials, and private browsing are excluded.</p><form id="form"><label>WinFIRE server URL<input id="serverUrl" type="url" placeholder="https://winfire.example.com" required></label><label>Enrollment code<input id="token" type="text" autocomplete="off" required></label><button id="submit">Enroll browser</button></form><p id="status" class="status" role="status"></p><script src="options.js"></script></body>
</html>
